[package]
name = "adr1-robot-firmware"
version = "0.1.0"
edition = "2021"
authors = ["ADR-1 Team"]
description = "Autonomous Deseeder Robot (ADR-1) firmware for STM32H743"
license = "MIT"

[dependencies]
# Embassy async runtime for STM32
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.4", features = ["tick-hz-32_768"] }
embassy-stm32 = { version = "0.3", features = ["stm32h743vi", "time-driver-any", "memory-x"] }
embassy-sync = "0.6"
embassy-futures = "0.1"
embassy-net = { version = "0.6", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }

# Embedded basics
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# HAL and driver crates
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io-async = "0.6"

# Sensor drivers
bme280 = "0.5"
bno055 = "0.4"

# Math and DSP
libm = "0.2"
micromath = "2.1"
heapless = "0.8"

# Protocol handling
crc = "3.2"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# Static allocation
static_cell = "2.1"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true
