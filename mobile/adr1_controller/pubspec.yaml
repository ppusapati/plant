name: adr1_controller
description: ADR-1 Autonomous Deseeder Robot - Mobile Controller App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # Connectivity
  flutter_blue_plus: ^1.31.0        # BLE communication
  web_socket_channel: ^2.4.0        # WiFi WebSocket
  connectivity_plus: ^6.0.3         # Network state

  # Maps & Location
  flutter_map: ^6.1.0               # OpenStreetMap (no Google dependency)
  latlong2: ^0.9.1                  # Coordinates
  geolocator: ^11.0.0               # Device GPS

  # UI Components
  fl_chart: ^0.68.0                 # Telemetry charts
  flutter_joystick: ^0.1.0          # Virtual joystick
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Local Storage
  hive: ^2.2.3                      # NoSQL local DB
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.2.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
